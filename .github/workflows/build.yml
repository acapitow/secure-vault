name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Moindre privilège pour le GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions épinglées par SHA de commit (protection supply chain).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # Valide aussi le checksum de gradle-wrapper.jar.
      - name: Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # Avant la clé de signature : les tests n'en ont pas besoin.
      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Clé de signature (si configurée)
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.p12" >> "$GITHUB_ENV"
            echo "Clé de signature stable utilisée."
          else
            echo "::warning::Secret SIGNING_KEYSTORE_B64 absent : clé debug éphémère, les mises à jour exigeront une désinstallation."
          fi

      - name: Build APK debug + release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      # Garde-fou : l'empreinte attendue intégrée à l'APK (BuildConfig.EXPECTED_SIGNER)
      # doit être celle du certificat qui le signe réellement, sinon l'application
      # se croirait re-signée et bloquerait l'ouverture du coffre.
      - name: Vérifier l'empreinte de signature intégrée
        if: env.SIGNING_KEYSTORE_PATH != ''
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk=$(ls app/build/outputs/apk/release/*.apk)
          actual=$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "Certificat de l'APK : $actual"
          test -n "$actual"
          unzip -p "$apk" 'classes*.dex' | grep -a -q "$actual" || { echo "::error::Empreinte absente de l'APK"; exit 1; }

      - name: Empreintes SHA-256 des APK
        run: |
          {
            echo "### APK"
            echo '```'
            sha256sum app/build/outputs/apk/*/*.apk
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Supprimer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.p12"

      - name: Publier l'APK debug
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secure-vault-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publier l'APK release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secure-vault-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
